<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CLIMATE CRISIS — 사라지는 해안 도시를 구하라!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c1:#38e1ff;--c2:#ff7a3d;--gold:#ffd34d;--ok:#3ee08f;--bad:#ff5a6a;--txt:#eaf6ff;--line:rgba(120,200,255,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#030a18;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--txt);touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;overflow:hidden}
#ui .p,#ui button,#ui textarea,#ui input{pointer-events:auto}
textarea,input{-webkit-user-select:text;user-select:text;font-family:inherit}
.ttl{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
/* HUD */
#hud{position:absolute;left:0;top:0;width:1280px;height:62px;display:none;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(3,10,24,.92),rgba(3,10,24,.55) 70%,rgba(3,10,24,0))}
.hava{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--c1);box-shadow:0 0 14px rgba(56,225,255,.55);flex:none}
.hname{font-weight:900;font-size:16px;line-height:1.15}.htitle{font-size:12px;color:var(--gold);font-weight:700}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:900;font-size:15px;white-space:nowrap}
.xpw{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:#9fe9ff}
.xpbar{width:110px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#38e1ff,#7bffb5);transition:width .5s}
.hsp{flex:1}
.hbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;background:rgba(20,50,90,.7);border:1px solid var(--line);font-weight:800;font-size:15px;transition:transform .12s}
.hbtn:active{transform:scale(.94)}
.combo-chip{background:linear-gradient(135deg,#ff7a3d,#ff3d8b);border:0;display:none}
/* guide */
#guide{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:900px;padding:10px 20px 10px 12px;border-radius:16px;background:rgba(6,18,40,.9);border:1px solid rgba(56,225,255,.5);box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 24px rgba(56,225,255,.18);display:none;align-items:center;gap:12px;font-size:18px;font-weight:700;line-height:1.35}
#guide .stepn{background:linear-gradient(135deg,#38e1ff,#2d7bff);color:#001428;font-weight:900;border-radius:10px;padding:5px 10px;font-size:14px;white-space:nowrap}
#guide.flash{animation:gflash .6s}
@keyframes gflash{0%{transform:translateX(-50%) scale(.9);opacity:0}60%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1);opacity:1}}
/* tools */
#tools{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 10px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;height:62px;padding:4px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(28,64,110,.95),rgba(14,36,70,.95));border:1px solid rgba(120,200,255,.4);font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .1s}
.tbtn .ti{font-size:24px;line-height:1}
.tbtn:active{transform:scale(.92)}
.tbtn.on{background:linear-gradient(180deg,#38e1ff,#1a8fd6);color:#001428;border-color:#bff4ff}
.tbtn.go{background:linear-gradient(180deg,#46f29e,#13a865);color:#002815;border-color:#c9ffe2;animation:pulse 1.2s infinite}
.tbtn.warn{background:linear-gradient(180deg,#ff8b5a,#d94a2b)}
.tbtn[disabled]{opacity:.38;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(70,242,158,.6)}50%{box-shadow:0 0 0 10px rgba(70,242,158,0)}}
/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:16px;font-weight:900;font-size:18px;background:linear-gradient(180deg,#38e1ff,#1677d4);color:#00142a;box-shadow:0 6px 0 #0b4b8c,0 10px 24px rgba(0,0,0,.35);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b4b8c}
.btn.orange{background:linear-gradient(180deg,#ffb15a,#ff6a2b);box-shadow:0 6px 0 #a33a10,0 10px 24px rgba(0,0,0,.35);color:#2a0d00}
.btn.green{background:linear-gradient(180deg,#5af2a8,#15b26b);box-shadow:0 6px 0 #0a6b3e,0 10px 24px rgba(0,0,0,.35);color:#00220f}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
/* modal */
.modal{position:absolute;inset:0;background:rgba(2,8,20,.66);display:flex;align-items:center;justify-content:center;animation:fin .25s;pointer-events:auto}
.modal.out{animation:fout .25s forwards}
.mbox{background:linear-gradient(180deg,#112a52,#0a1a35);border:1px solid rgba(120,200,255,.4);border-radius:24px;padding:24px 30px;width:840px;max-width:94%;max-height:660px;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .4s cubic-bezier(.2,1.5,.4,1);touch-action:pan-y}
.mbox.wide{width:1060px}
@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.qtag{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(56,225,255,.15);border:1px solid rgba(56,225,255,.5);color:#9fefff;font-weight:900;font-size:14px;margin-bottom:10px}
.qq{font-size:25px;font-weight:900;line-height:1.4;margin-bottom:6px}
.qsub{font-size:16px;color:#b5d6f2;margin-bottom:14px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{text-align:left;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid rgba(120,200,255,.3);font-size:18px;font-weight:700;line-height:1.4;display:flex;gap:12px;align-items:flex-start;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt .ol{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(56,225,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;color:#9fefff}
.opt.right{background:rgba(62,224,143,.25);border-color:var(--ok)}
.opt.wrong{background:rgba(255,90,106,.2);border-color:var(--bad);animation:shake .4s;opacity:.65}
.opt.sel{background:rgba(56,225,255,.22);border-color:var(--c1)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qfb{font-size:17px;line-height:1.6}
.fb{margin-top:8px;padding:14px 16px;border-radius:14px;display:flex;gap:14px;align-items:flex-start}
.fb.good{background:rgba(62,224,143,.14);border:1px solid rgba(62,224,143,.5)}
.fb.badf{background:rgba(255,90,106,.12);border:1px solid rgba(255,90,106,.45)}
.fb canvas{border-radius:12px;background:#0b2141;flex:none}
.mrow{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* toasts */
#toasts{position:absolute;right:12px;top:68px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:420px}
.toast{padding:10px 16px;border-radius:14px;background:rgba(8,22,46,.94);border:1px solid var(--line);font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tin .35s cubic-bezier(.2,1.4,.4,1);max-width:420px;line-height:1.4}
.toast.out{animation:tout .4s forwards}
.toast.gold{border-color:var(--gold);color:#fff3c2}.toast.dex{border-color:#b78bff;background:rgba(40,16,70,.94)}.toast.obs{border-color:#38e1ff;background:rgba(4,40,70,.95)}.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateX(60px);opacity:0}}@keyframes tout{to{transform:translateX(60px);opacity:0}}
#combo{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-size:54px;color:#fff;text-shadow:0 0 20px #ff3d8b,0 4px 0 #b3125a;pointer-events:none;opacity:0;white-space:nowrap}
#combo.show{animation:combo 1.2s}
@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.4)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
/* layer screens */
#layer{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.panel{background:rgba(8,22,46,.86);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
/* title */
.alert{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:rgba(255,40,60,.18);border:1px solid rgba(255,80,90,.8);color:#ffd0d4;font-weight:900;font-size:18px;animation:blink 1.4s infinite}
@keyframes blink{50%{background:rgba(255,40,60,.4);box-shadow:0 0 30px rgba(255,60,80,.6)}}
.bigt{font-size:96px;line-height:1;background:linear-gradient(180deg,#fff,#7fe7ff 55%,#2d8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(56,225,255,.45))}
.subt{font-size:30px;color:#ffd34d;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.msg{font-size:19px;font-weight:700;text-shadow:0 2px 8px #000;line-height:1.6;text-align:center}
.tmenu{display:flex;gap:14px}
/* char select */
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ccard{width:240px;padding:16px;border-radius:22px;background:rgba(10,28,58,.9);border:3px solid rgba(120,200,255,.25);text-align:center;transition:transform .15s}
.ccard.sel{border-color:var(--c1);transform:translateY(-8px);box-shadow:0 0 30px rgba(56,225,255,.45)}
.ccard .av{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.3)}
.ccard b{font-size:22px}.ccard small{display:block;color:#9fd6ff;font-size:14px;margin-top:4px;font-weight:700}.ccard p{font-size:13px;color:#c4dcf2;margin:8px 0 0;line-height:1.45}
.nin{font-size:22px;padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:#fff;width:300px;text-align:center;font-weight:700}
/* hub */
.mcards{display:flex;gap:20px}
.mcard{width:380px;border-radius:26px;padding:20px;background:linear-gradient(180deg,rgba(18,44,86,.95),rgba(8,22,46,.95));border:2px solid rgba(120,200,255,.3);position:relative;overflow:hidden;transition:transform .15s;text-align:left}
.mcard:active{transform:scale(.97)}
.mcard.lock{filter:grayscale(.9) brightness(.6)}
.mcard .goal{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:900;font-size:15px;color:#1b1300;margin-bottom:10px}
.mcard h3{margin:4px 0 8px;font-size:26px}
.mcard .gt{font-size:17px;font-weight:700;line-height:1.5;color:#e8f4ff;min-height:76px}
.mcard .gt em{font-style:normal;color:#ffd34d}
.mcard ul{margin:10px 0 0;padding-left:20px;font-size:14px;color:#b5d6f2;line-height:1.7}
.mcard .stamp{position:absolute;right:14px;top:14px;font-size:15px;font-weight:900;padding:6px 12px;border-radius:12px;background:rgba(62,224,143,.25);border:1px solid var(--ok);color:#b8ffd9}
.mcard .icon{position:absolute;right:-10px;bottom:-16px;font-size:110px;opacity:.16}
/* dex */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dcard{border-radius:16px;padding:12px;min-height:150px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.dcard .di{font-size:44px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-bottom:8px}
.dcard b{font-size:15px;display:block;margin-bottom:4px}.dcard p{font-size:12.5px;color:#c4dcf2;margin:0;line-height:1.5}
.dcard.lock{opacity:.45}.dcard.lock .di{filter:brightness(0);opacity:.5}
.tabs{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:14px}
.tab.on{background:var(--c1);color:#001428}
/* shop */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sitem{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.sitem .si{font-size:34px;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);flex:none}
.sitem b{font-size:15px;display:block}.sitem small{color:#9fd6ff;font-size:12px}
.sitem button{margin-left:auto;padding:8px 12px;border-radius:12px;font-weight:900;font-size:14px;background:var(--gold);color:#2a1d00;white-space:nowrap}
.sitem button.eq{background:var(--c1);color:#001428}.sitem button.on{background:var(--ok);color:#00220f}
/* lab prep */
.prep{position:absolute;left:150px;top:142px;width:980px;padding:18px 22px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.pitem{border-radius:16px;background:#fff;border:3px solid #cfe0ef;padding:6px;text-align:center;color:#0d2236;font-weight:900;font-size:16px;transition:transform .12s}
.pitem:active{transform:scale(.93)}
.pitem svg{width:100%;height:92px}
.pitem.got{border-color:var(--ok);background:#e8fff2;opacity:.55}
.pitem.no{border-color:var(--bad);animation:shake .4s}
.ptray{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pchk{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:15px}
.pchk i{width:20px;height:20px;border-radius:5px;border:2px solid #9fd6ff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.pchk.ok{border-color:var(--ok)}.pchk.ok i{background:var(--ok);border-color:var(--ok);color:#002}
#log{position:absolute;left:10px;top:120px;width:270px;padding:12px 14px;display:none;max-height:330px;overflow:auto}
#log h4{margin:0 0 8px;font-size:16px;color:#9fefff}
#log .li{font-size:13.5px;line-height:1.45;padding:6px 0;border-top:1px dashed rgba(120,200,255,.25);display:flex;gap:8px}
#log .li b{color:#ffd34d;white-space:nowrap}
.prog{position:absolute;left:470px;top:122px;width:340px;padding:10px 14px;font-weight:800;font-size:14px;display:none}
.pbar{height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0b46c,#ffd34d);transition:width .2s}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ta{width:100%;min-height:70px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;padding:12px;font-size:17px;resize:none;margin-top:6px}
/* report */
.rep{background:#fdfcf7;color:#1a2433;border-radius:16px;padding:22px 26px;font-size:15.5px;line-height:1.7}
.rep h2{margin:0 0 4px;font-size:26px;color:#0d4f8b}.rep h4{margin:14px 0 4px;color:#0d4f8b;font-size:17px;border-bottom:2px solid #d8e6f3;padding-bottom:3px}
.rep .meta{color:#5a6b80;font-size:14px}
.rep ol,.rep ul{margin:4px 0;padding-left:22px}
.rep .lv{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:900;color:#fff}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px 0;align-items:stretch}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid var(--line);font-weight:800;font-size:16.5px;display:flex;align-items:center;gap:10px;min-height:58px;text-align:left;transition:transform .1s}
.mi .e{font-size:26px}
.mi.sel{border-color:var(--gold);background:rgba(255,211,77,.18);transform:scale(1.03)}
.mi.done{border-color:var(--ok);background:rgba(62,224,143,.18);opacity:.8}
.mi.no{animation:shake .4s;border-color:var(--bad)}
/* sentence builder */
.sent{font-size:20px;font-weight:700;line-height:2.3;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:10px}
.blank{display:inline-block;min-width:110px;padding:0 12px;height:42px;line-height:40px;border-radius:12px;border:2px dashed #9fd6ff;text-align:center;vertical-align:middle;color:#ffd34d;background:rgba(0,0,0,.25)}
.blank.f{border-style:solid}.blank.ok{border-color:var(--ok);color:#b8ffd9}.blank.x{border-color:var(--bad);animation:shake .4s}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.wc{padding:10px 16px;border-radius:12px;background:linear-gradient(180deg,#2a5ea8,#183d75);border:1px solid #6fb6ff;font-weight:900;font-size:17px}
.wc.used{opacity:.25;pointer-events:none}
/* side panels */
.spanel{position:absolute;padding:14px 16px}
.lvbtn{width:100%;margin:6px 0;padding:12px;border-radius:14px;font-weight:900;font-size:17px}
.meter{display:flex;flex-direction:column-reverse;gap:4px;margin:8px 0}
.meter i{height:16px;border-radius:5px;background:rgba(255,255,255,.1)}
.meter i.on{background:linear-gradient(90deg,#38e1ff,#2d7bff);box-shadow:0 0 10px rgba(56,225,255,.6)}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-top:1px dashed rgba(120,200,255,.2)}
.stat b{color:#ffd34d}
.cert{width:820px;padding:34px 44px;border-radius:24px;background:linear-gradient(180deg,#fffaf0,#f4ead2);color:#3a2a10;text-align:center;border:8px double #c99a2e;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.cert h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:56px;margin:0;color:#8a5a00;letter-spacing:8px}
.cert .who{font-size:34px;font-weight:900;margin:14px 0;color:#1d3b66}
.cert p{font-size:19px;line-height:1.8;margin:6px 0}
.mini{font-size:13px;color:#9fd6ff}
#printArea{display:none}
@media print{
 html,body{overflow:visible;height:auto;background:#fff}
 #cv,#ui{display:none!important}
 #printArea{display:block!important;color:#000;padding:20px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
 <div id="layer"></div>
 <div id="hud"></div>
 <div id="guide"></div>
 <div id="log" class="panel p"></div>
 <div id="prog" class="prog panel"></div>
 <div id="tools"></div>
 <div id="toasts"></div>
 <div id="combo" class="ttl"></div>
</div>
<div id="printArea"></div>
<script>
'use strict';
/* ================= CORE ================= */
const LW=1280,LH=720;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function emo(c,e,x,y,s){c.font=`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(e,x,y);}
function txt(c,t,x,y,s,col,al,w){c.font=`${w||700} ${s}px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;c.fillStyle=col||'#fff';c.textAlign=al||'center';c.textBaseline='middle';c.fillText(t,x,y);}
function label(c,t,x,y,s,bg,fg){c.font=`800 ${s}px "Noto Sans KR",sans-serif`;const w=c.measureText(t).width+s*1.1;rr(c,x-w/2,y-s*0.85,w,s*1.7,s*0.5);c.fillStyle=bg||'rgba(5,20,45,.85)';c.fill();txt(c,t,x,y+1,s,fg||'#fff','center',800);}

const AU={ctx:null,on:true,loops:{},buf:null,master:null,
 init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();const n=this.ctx.sampleRate*2;this.buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=this.buf.getChannelData(0);let b=0;for(let i=0;i<n;i++){b=b*0.6+(Math.random()*2-1)*0.4;d[i]=b;}this.master=this.ctx.createGain();this.master.gain.value=this.on?1:0;this.master.connect(this.ctx.destination);}catch(e){this.ctx=null;}},
 tone(f,d=0.12,type='sine',v=0.14,delay=0,f2){if(!this.ctx)return;const t=this.ctx.currentTime+delay;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.05);},
 click(){this.tone(720,0.06,'triangle',0.09);},
 pop(){this.tone(500,0.12,'sine',0.14,0,900);},
 ok(){[523,659,784,1046].forEach((f,i)=>this.tone(f,0.2,'triangle',0.12,i*0.07));},
 bad(){this.tone(220,0.22,'sawtooth',0.06,0,160);this.tone(160,0.3,'square',0.04,0.1,120);},
 coin(){this.tone(988,0.08,'square',0.05);this.tone(1318,0.18,'square',0.05,0.07);},
 lvl(){[523,659,784,1046,1318].forEach((f,i)=>this.tone(f,0.25,'triangle',0.1,i*0.09));},
 boom(){if(!this.ctx)return;const s=this.ctx.createBufferSource();s.buffer=this.buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;const g=this.ctx.createGain();const t=this.ctx.currentTime;g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+0.9);},
 splash(){if(!this.ctx)return;const s=this.ctx.createBufferSource();s.buffer=this.buf;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;const g=this.ctx.createGain();const t=this.ctx.currentTime;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+0.6);},
 loop(name,type,freq,q){if(!this.ctx)return null;if(this.loops[name])return this.loops[name];const s=this.ctx.createBufferSource();s.buffer=this.buf;s.loop=true;const f=this.ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||0.8;const g=this.ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(this.master);s.start();return this.loops[name]={s,g,f};},
 vol(name,v){const l=this.loops[name];if(l)l.g.gain.setTargetAtTime(v,this.ctx.currentTime,0.08);},
 stopAll(){for(const k in this.loops){try{this.loops[k].s.stop();}catch(e){}}this.loops={};},
 toggle(){this.on=!this.on;if(this.master)this.master.gain.value=this.on?1:0;}
};

/* ask: multiple-choice mission with visual explanation */
function ask(o){const m=modal(`<div class="qtag">${o.tag||'🔍 미션'}</div><div class="qq">${o.q}</div>${o.sub?`<div class="qsub">${o.sub}</div>`:''}<div class="opts"></div><div class="qfb"></div>`);
 const box=m.querySelector('.opts'),fb=m.querySelector('.qfb');let tries=0,done=false;
 shuffle(o.opts.map((_,i)=>i)).forEach((i,k)=>{const b=el('button','opt',`<span class="ol">${'ABCDE'[k]}</span><span>${o.opts[i]}</span>`);box.appendChild(b);
  b.onclick=()=>{if(done||b.classList.contains('wrong'))return;
   if(i===o.ans){done=true;b.classList.add('right');AU.ok();const r=b.getBoundingClientRect();reward(o.coins||30,o.xp||25,(r.left+r.width/2-OX)/SC,(r.top-OY)/SC);
    fb.innerHTML=`<div class="fb good"><div><b style="color:#7bffb5;font-size:19px">${tries?'정답! 끝까지 생각해 냈어요 👏':'정답! 훌륭해요 🎉'}</b><br>${o.explain||''}</div></div><div class="mrow"><button class="btn green">계속하기 →</button></div>`;
    fb.querySelector('button').onclick=()=>{closeModal(m);o.onDone&&o.onDone(tries===0);};
    fb.scrollIntoView&&setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
   }else{tries++;b.classList.add('wrong');miss();
    fb.innerHTML=`<div class="fb badf">${o.anim?'<canvas width="360" height="190"></canvas>':''}<div><b style="color:#ff9aa5;font-size:18px">다시 생각해 봐요!</b><br>${(o.wrong&&o.wrong[i])||'그림을 보면서 원인을 다시 찾아보세요.'}${o.hint?`<br><span style="color:#ffd34d">💡 ${o.hint}</span>`:''}</div></div>`;
    if(o.anim)miniAnim(fb.querySelector('canvas'),o.anim);}};});
 return m;}

 const Lc=m.querySelector('.L'),Rc=m.querySelector('.R'),fb=m.querySelector('.qfb');let sel=null,left=o.pairs.length,miss1=0;
 o.pairs.forEach((p,i)=>{const a=el('button','mi',`<span class="e">${p.ae}</span>${p.a}`);a.dataset.i=i;Lc.appendChild(a);a.onclick=()=>{if(a.classList.contains('done'))return;Lc.querySelectorAll('.mi').forEach(x=>x.classList.remove('sel'));a.classList.add('sel');sel=a;AU.click();};});

   if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');AU.ok();const r=b.getBoundingClientRect();reward(12,10,(r.left-OX)/SC,(r.top-OY)/SC);fb.innerHTML=`<div class="fb good"><div>✅ <b>${p.a} ↔ ${p.b}</b><br>${p.info||''}</div></div>`;sel=null;left--;
    if(!left){fb.innerHTML+=`<div class="mrow"><button class="btn green">모두 연결 완료! 계속 →</button></div>`;fb.querySelector('button').onclick=()=>{closeModal(m);o.onDone&&o.onDone(miss1);};FX.confetti(80);}
   }else{miss1++;b.classList.add('no');sel.classList.add('no');const s=sel;setTimeout(()=>{b.classList.remove('no');s.classList.remove('no');},400);miss();fb.innerHTML=`<div class="fb badf"><div>🤔 다시 생각해 봐요. ${o.pairs[+s.dataset.i].hint||''}</div></div>`;}};});
 return m;}

/* ================= FX ================= */
const FX={p:[],f:[],
 burst(x,y,n=30,cols){cols=cols||['#ffd34d','#38e1ff','#7bffb5','#ff7ab6','#ffffff'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(140,400);this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,g:560,l:rnd(.6,1.1),t:0,c:pick(cols),s:rnd(4,8),r:rnd(0,6),vr:rnd(-8,8),k:Math.random()<.55?'star':'sq'});}},
 confetti(n=120){const cols=['#ffd34d','#38e1ff','#7bffb5','#ff7ab6','#ff8a3d','#b78bff'];for(let i=0;i<n;i++)this.p.push({x:rnd(0,LW),y:rnd(-260,-10),vx:rnd(-60,60),vy:rnd(90,220),g:40,l:rnd(3,4.5),t:0,c:pick(cols),s:rnd(6,10),r:rnd(0,6),vr:rnd(-6,6),k:'sq'});},
 firework(x,y){const cols=pick([['#ffd34d','#fff3b0'],['#38e1ff','#bff4ff'],['#ff7ab6','#ffd0e6'],['#7bffb5','#e0fff0']]);for(let i=0;i<70;i++){const a=i/70*Math.PI*2,s=rnd(170,290);this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:150,l:rnd(1,1.7),t:0,c:pick(cols),s:3.2,k:'dot',drag:1});}AU.boom();},
 fireworks(n=4){for(let i=0;i<n;i++)setTimeout(()=>this.firework(rnd(200,1080),rnd(120,360)),i*320);},
 float(x,y,t,c){this.f.push({x,y,t:0,s:t,c:c||'#fff'});},
 update(dt){for(const p of this.p){p.t+=dt;p.vy+=p.g*dt;if(p.drag){p.vx*=0.985;p.vy*=0.985;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=(p.vr||0)*dt;}this.p=this.p.filter(p=>p.t<p.l);for(const f of this.f)f.t+=dt;this.f=this.f.filter(f=>f.t<1.4);},
 draw(c){for(const p of this.p){const a=1-p.t/p.l;c.globalAlpha=clamp(a*1.5,0,1);c.fillStyle=p.c;if(p.k==='dot'){c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();}else{c.save();c.translate(p.x,p.y);c.rotate(p.r);if(p.k==='star'){c.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*0.45:p.s;c.lineTo(Math.cos(i*Math.PI/5)*r,Math.sin(i*Math.PI/5)*r);}c.fill();}else c.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);c.restore();}}c.globalAlpha=1;
  for(const f of this.f){const a=1-f.t/1.4;c.globalAlpha=a;c.font='900 28px "Noto Sans KR",sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.6)';c.strokeText(f.s,f.x,f.y-f.t*60);c.fillStyle=f.c;c.fillText(f.s,f.x,f.y-f.t*60);}c.globalAlpha=1;}};

/* ================= MINI EXPLANATION ANIMATIONS ================= */
function miniAnim(cv2,kind){const c=cv2.getContext('2d');const W=cv2.width,H=cv2.height;let t0=performance.now();
 function house(x,y,col,sub){c.fillStyle='#f3efe6';c.fillRect(x-14,y-20,28,20);c.fillStyle=col;c.beginPath();c.moveTo(x-18,y-20);c.lineTo(x,y-34);c.lineTo(x+18,y-20);c.fill();if(sub){c.fillStyle='rgba(40,140,230,.45)';}}
 function f(){if(!cv2.isConnected)return;const t=((performance.now()-t0)/1000)%6;c.clearRect(0,0,W,H);const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f2c55');g.addColorStop(1,'#0a1a33');c.fillStyle=g;c.fillRect(0,0,W,H);
  if(kind==='slope'||kind==='island'){const gy=x=>x<60?50:Math.min(170,50+(x-60)*0.5);c.fillStyle='#d4ad6c';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,gy(x));c.lineTo(W,H);c.fill();
   const L=170-clamp(t/4.5,0,1)*105;house(90,gy(90),'#3a7bff');house(250,gy(250),'#ff8a3d');c.fillStyle='#2f9e44';c.beginPath();c.arc(180,gy(180)-16,10,0,7);c.fill();
   c.fillStyle='rgba(60,160,255,.55)';c.fillRect(0,L,W,H-L);c.strokeStyle='#bfe9ff';c.lineWidth=2;c.beginPath();for(let x=0;x<=W;x+=4)c.lineTo(x,L+Math.sin(x*0.08+t*5)*2);c.stroke();
   c.strokeStyle='#ffd34d';c.lineWidth=3;c.beginPath();c.moveTo(W-30,H-10);c.lineTo(W-30,L+8);c.stroke();c.beginPath();c.moveTo(W-38,L+18);c.lineTo(W-30,L+6);c.lineTo(W-22,L+18);c.stroke();
   txt(c,'높은 곳',90,gy(90)-50,13,'#bfe0ff');txt(c,'낮은 곳',250,gy(250)-50,13,'#ffcf9f');
   const s=L<gy(250)-6?'① 낮은 곳의 집이 먼저 잠겨요!':'물은 수평으로 차오르며 낮은 곳부터 채워요';txt(c,s,W/2,18,15,'#ffd34d','center',900);
   if(L<gy(90))txt(c,'② 높은 곳은 가장 나중에 잠겨요',W/2,40,14,'#7bffb5','center',800);}
  if(kind==='cliff'){const cut=clamp((t-1)/3,0,1);c.fillStyle='#8c6a48';c.beginPath();c.moveTo(0,H);c.lineTo(0,70);c.lineTo(190-cut*40,70);c.lineTo(190-cut*40,120);c.lineTo(190-cut*70,150);c.lineTo(200,150);c.lineTo(230,H);c.fill();
   c.fillStyle='#4caf50';c.fillRect(0,64,190-cut*40,8);if(t<3.2){house(170,64,'#ff8a3d');}else{c.save();c.translate(205,64+(t-3.2)*60);c.rotate((t-3.2)*1.2);house(0,0,'#ff8a3d');c.restore();}
   const L=140;c.fillStyle='rgba(60,160,255,.6)';c.beginPath();c.moveTo(W,H);c.lineTo(W,L);for(let x=W;x>=150;x-=4)c.lineTo(x,L+Math.sin(x*0.06-t*6)*6);c.lineTo(150,H);c.fill();
   const wx=200+Math.sin(t*3)*10;c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<6;i++){c.beginPath();c.arc(wx+rnd(-6,6),L-6-rnd(0,24)*Math.abs(Math.sin(t*3)),3,0,7);c.fill();}
   txt(c,'파도가 절벽 아래를 계속 깎아요 → 절벽이 무너져요',W/2,20,14,'#ffd34d','center',900);if(t>3.2)txt(c,'건물이 무너지고 도로가 끊겨요!',W/2,42,14,'#ff9aa5','center',900);}
  if(kind==='turtle'){c.fillStyle='#e6c88a';c.beginPath();c.moveTo(0,H);c.lineTo(0,90);for(let x=0;x<=W;x+=6)c.lineTo(x,90+x*0.25);c.lineTo(W,H);c.fill();
   for(let i=0;i<3;i++){c.fillStyle='#fffaf0';c.beginPath();c.ellipse(220+i*10,90+220*0.25-4,5,6,0,0,7);c.fill();}emo(c,'🐢',120,105,26);
   const L=180-clamp(t/4,0,1)*60;c.fillStyle='rgba(60,160,255,.6)';c.fillRect(0,L,W,H-L);c.strokeStyle='#bfe9ff';c.beginPath();for(let x=0;x<=W;x+=4)c.lineTo(x,L+Math.sin(x*0.08+t*5)*2);c.stroke();
   txt(c,L<150?'알 둥지가 물에 잠겼어요! 새끼가 태어나기 어려워요':'해수면이 오르면 알 낳는 해변이 물에 잠겨요',W/2,20,14,'#ffd34d','center',900);}
  requestAnimationFrame(f);}f();}

const ptrs=new Map();
function lp(e){return{x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC,id:e.pointerId};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=lp(e);ptrs.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId);}catch(_){}scene&&scene.down&&scene.down(p,ptrs);});
cv.addEventListener('pointermove',e=>{const p=lp(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);scene&&scene.move&&scene.move(p,ptrs,ptrs.has(e.pointerId));});
const pup=e=>{const p=lp(e);ptrs.delete(e.pointerId);scene&&scene.up&&scene.up(p,ptrs);};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',e=>{e.preventDefault();scene&&scene.wheel&&scene.wheel(e.deltaY,lp(e));},{passive:false});

let last=performance.now();

 update(dt){const s=st;s.t+=dt;const h=s.h,cm=s.cam;

   let sum=0,tot=0,sea=0;for(let i=0;i<N;i++){sum+=Math.min(h[i],g(i));tot+=g(i);if(i>118)sea+=h[i];}const pr=sum/tot;sea/=N-119;

   if(pr>=0.9&&sea<0.9&&!b.carry){s.h0=Float32Array.from(h);s.beachCols=[];for(let i=0;i<N;i++)if(h[i]>0.03&&h[i]<1.35)s.beachCols.push(i);reward(30,25,600,300);AU.ok();toast('✅ 경사진 육지 모형 완성! 낮은 쪽은 해안가 모래사장이 되었어요.','gold');setPhase('models');}}

    for(let k=-1;k<=1;k++){const j=clamp(ci+k,0,N-1);s.wvv[j]-=0.035*rate/MAXR;}s.T=Math.min(1,s.T+dt*1.6);

function isLand(lon,lat){if(lat<-72)return true;for(const b of BLOBS){let dl=lon-b[0];if(dl>180)dl-=360;if(dl<-180)dl+=360;const d=Math.hypot(dl*Math.cos(lat*Math.PI/180),lat-b[1]);if(d<b[2]*(0.85+0.15*Math.sin(lon*0.3+lat*0.2)))return true;}return false;}

  gr.innerHTML=DEX.filter(d=>cur==='전체'||d.cat===cur).map(d=>{const u=S.dex[d.id];return `<div class="dcard ${u?'':'lock'}"><div class="di" style="background:${u?(bg||'linear-gradient(135deg,#123a6b,#0b2141)'):'rgba(0,0,0,.3)'}">${d.i}</div><b>${u?d.n:'???'}</b><p>${u?d.d:'아직 발견하지 못했어요. ('+d.cat+')'}</p></div>`;}).join('');};r();}
function openShop(){const cats=[...new Set(SHOP.map(s=>s.cat))];let cur=cats[0];const m=modal(`<div style="display:flex;align-items:center;justify-content:space-between"><div class="qq">🛒 탐험대 상점 <span class="chip" style="display:inline-flex">🪙 <span class="cc">${S.coins}</span></span></div><button class="btn ghost">닫기 ✕</button></div><div class="qsub">미션을 해결해 모은 환경 코인으로 아이템을 사요!</div><div class="tabs"></div><div class="sgrid"></div>`,'wide');
 m.querySelector('.btn').onclick=()=>closeModal(m);const tb=m.querySelector('.tabs'),gr=m.querySelector('.sgrid');
 const eqd=it=>it.k==='outfit'?S.eq.outfit===it.id:it.k==='title'?S.eq.title===it.n:it.k==='dexbg'?S.eq.dexbg===it.v:it.k==='decor'?true:!!S.eq[it.k];
 const r=()=>{m.querySelector('.cc').textContent=S.coins;tb.innerHTML=cats.map(c=>`<button class="tab ${c===cur?'on':''}">${c}</button>`).join('');tb.querySelectorAll('.tab').forEach((b,i)=>b.onclick=()=>{cur=cats[i];r();});
  gr.innerHTML='';SHOP.filter(s=>s.cat===cur).forEach(it=>{const own=S.own[it.id];const d=el('div','sitem',`<div class="si" style="${it.k==='outfit'&&it.v?'background:'+it.v:''}">${it.k==='outfit'?avatarSVG(Math.max(0,S.char),it.v||CHARS[Math.max(0,S.char)].color):it.i}</div><div><b>${it.n}</b><small>${own?(eqd(it)?'사용 중':'보유 중'):'🪙 '+it.p}</small></div>`);const b=el('button',own?(eqd(it)?'on':'eq'):'',own?(eqd(it)?(it.k==='decor'?'설치됨':'✔ 장착'):'장착하기'):'구매');
   b.onclick=()=>{if(!own){if(S.coins<it.p){AU.bad();toast('🪙 코인이 부족해요! 미션을 더 해결해 봐요.','bad');return;}S.coins-=it.p;S.own[it.id]=1;AU.coin();toast(`🎁 <b>${it.n}</b> 구매 완료!`,'gold');}
    if(it.k==='outfit')S.eq.outfit=it.id;else if(it.k==='title')S.eq.title=it.n;else if(it.k==='dexbg')S.eq.dexbg=it.v;else if(it.k!=='decor')S.eq[it.k]=1;
    if(it.k==='decor')toast('🏙️ 해안 도시(미션 2)에서 볼 수 있어요!');save();hud();r();};d.appendChild(b);gr.appendChild(d);
   const si=d.querySelector('.si');if(it.k==='outfit'){si.style.overflow='hidden';si.style.padding='0';}});};r();}
function openRecords(){const r=S.report;const days=Math.max(1,Math.round((Date.now()-S.start)/864e5));const m=modal(`<div style="display:flex;align-items:center;justify-content:space-between"><div class="qq">📒 탐험 기록</div><button class="btn ghost">닫기 ✕</button></div>
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0">${[['🪙 환경 코인',S.coins],['⭐ 레벨','Lv.'+lvl()],['🔥 최고 콤보',S.maxCombo],['📖 도감',Object.keys(S.dex).length+'/'+DEX.length]].map(a=>`<div class="panel" style="padding:12px;text-align:center"><div class="mini">${a[0]}</div><div class="ttl" style="font-size:26px;color:#ffd34d">${a[1]}</div></div>`).join('')}</div>
 <div class="stat">🧪 미션 1 · 해수면 상승 실험실<b>${S.m.m1?'✅ 완료':'진행 전'}</b></div><div class="stat">🏙️ 미션 2 · 침수되는 해안 도시<b>${S.m.m2?'✅ 완료':'진행 전'}</b></div><div class="stat">🌍 미션 3 · 기후변화 현장 추적<b>${S.m.m3?'✅ 완료':'진행 전'}</b></div>
 ${S.thought?`<div class="fb good" style="margin-top:10px"><div>🎤 <b>나의 생각</b><br>${S.thought.replace(/</g,'&lt;')}</div></div>`:''}
 <div class="mrow">${r?'<button class="btn green" id="rp">🧪 실험 보고서 보기</button>':'<span class="mini">실험을 완료하면 실험 보고서가 여기에 저장돼요.</span>'}</div>`,'wide');
 m.querySelector('.btn').onclick=()=>closeModal(m);const b=m.querySelector('#rp');if(b)b.onclick=()=>{closeModal(m);const k=modal(Lab_reportHTML(r)+`<div class="mrow"><button class="btn ghost">🖨️ 인쇄 · PDF 저장</button><button class="btn green">닫기</button></div>`,'wide');const q=k.querySelectorAll('.mrow button');q[0].onclick=()=>{$('#printArea').innerHTML=Lab_reportHTML(r);window.print();};q[1].onclick=()=>closeModal(k);};}
function Lab_reportHTML(r){return `<div class="rep"><h2>🧪 해수면 상승으로 인한 피해 모형실험 보고서</h2><div class="meta">환경 탐험대원 <b>${r.name}</b> · ${r.date}</div><h4>물의 높이 변화</h4><span class="lv" style="background:#e53935">실험 전 ${r.m0.toFixed(1)}cm</span> → <span class="lv" style="background:#1e6bff">실험 후 ${r.m1.toFixed(1)}cm</span> <b>${(r.m1-r.m0).toFixed(1)}cm 상승</b><h4>나의 예상</h4><ul>${r.pred.map(p=>`<li>${p}</li>`).join('')}</ul>${r.predText?`<div>✏️ “${r.predText.replace(/</g,'&lt;')}”</div>`:''}<h4>관찰 결과 (먼저 일어난 순서)</h4><ol>${r.log.map(e=>`<li>${e.i} ${e.t} <b>(${e.lv.toFixed(1)}cm)</b></li>`).join('')}${r.highSafe?'<li>🏡 높은 곳의 집은 끝까지 잠기지 않았다.</li>':''}</ol><h4>알게 된 점</h4><ul>${r.conc.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;}
function openRank(){const r=getRank().sort((a,b)=>b.coins-a.coins||b.xp-a.xp).slice(0,15);const m=modal(`<div style="display:flex;align-items:center;justify-content:space-between"><div class="qq">🏆 환경 탐험대 랭킹</div><button class="btn ghost">닫기 ✕</button></div><div class="qsub">이 기기(태블릿)에서 활동한 대원들의 순위예요.</div>
 ${r.length?r.map((x,i)=>`<div class="stat" style="align-items:center;padding:8px 4px;font-size:16px"><span style="display:flex;align-items:center;gap:10px"><b style="width:34px;color:${i<3?'#ffd34d':'#9fd6ff'};font-size:20px">${i<3?['🥇','🥈','🥉'][i]:i+1}</b><span class="hava" style="width:36px;height:36px">${avatarSVG(Math.max(0,x.char))}</span>${x.name} <span class="mini">${(CHARS[x.char]||CHARS[0]).role}</span></span><span>🪙 <b>${x.coins}</b> · 미션 ${x.m}/3 · 도감 ${x.dex}</span></div>`).join(''):'<div class="mini">아직 기록이 없어요. 첫 번째 대원이 되어 보세요!</div>'}`);m.querySelector('.btn').onclick=()=>closeModal(m);}

/* ================= CERTIFICATE ================= */
const Cert={enter(){showHud(true);this.t=0;FX.fireworks(6);FX.confetti(160);AU.lvl();if(!S.eq.title||S.eq.title==='신입 환경 탐험대원'){S.eq.title='환경 탐험대장';save();hud();}
 const d=new Date();$('#layer').innerHTML=`<div class="center"><div class="cert p"><div style="font-size:15px;letter-spacing:6px;color:#8a5a00;font-weight:900">기후변화 대응본부</div><h1>임 명 장</h1><div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px"><div class="hava" style="width:96px;height:96px;border-color:#c99a2e">${avatarSVG(Math.max(0,S.char))}</div><div class="who">${S.name} 대원</div></div>
 <p>위 대원은 해수면 상승 모형실험에 적극적으로 참여하고,<br>모형을 활용해 해수면 상승 피해에 대한 생각을 표현하였으며,<br>기후변화로 해수면이 상승하면 일어나는 피해를 설명할 수 있으므로<br><b style="font-size:24px;color:#8a5a00">「 환경 탐험대장 」</b>으로 임명합니다.</p>
 <p style="font-size:15px;color:#6b5a3a;margin-top:12px">🪙 ${S.coins} 코인 · Lv.${lvl()} · 도감 ${Object.keys(S.dex).length}/${DEX.length} · ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</p>
 <div class="mrow"><button class="btn ghost" style="color:#3a2a10;border-color:#c99a2e" id="pr">🖨️ 인쇄</button><button class="btn green" id="bk">미션 보드로</button></div></div></div>`;
 $('#pr').onclick=()=>{$('#printArea').innerHTML=$('#layer .cert').outerHTML;window.print();};$('#bk').onclick=()=>go(Hub);},
 update(dt){this.t+=dt;if(Math.random()<dt*1.2)FX.firework(rnd(100,1180),rnd(80,300));},
 draw(c){let g=c.createRadialGradient(640,360,50,640,360,800);g.addColorStop(0,'#2a1f4a');g.addColorStop(1,'#05060f');c.fillStyle=g;c.fillRect(0,0,LW,LH);for(let i=0;i<16;i++){const a=i/16*Math.PI*2+this.t*0.2;c.fillStyle='rgba(255,211,77,.06)';c.beginPath();c.moveTo(640,360);c.lineTo(640+Math.cos(a)*900,360+Math.sin(a)*900);c.lineTo(640+Math.cos(a+0.12)*900,360+Math.sin(a+0.12)*900);c.fill();}}};

/* ================= BOOT ================= */
go(Title);requestAnimationFrame(frame);

</script>
